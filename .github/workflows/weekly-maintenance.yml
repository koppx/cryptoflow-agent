name: weekly-maintenance

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: CLI smoke tests
        run: |
          cryptoflow-agent examples/sample_packets.jsonl --format jsonl --output json
          cryptoflow-agent examples/sample_eve.jsonl --format eve --output csv
      - name: Open maintenance issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Weekly maintenance failed: ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              'The scheduled weekly maintenance workflow failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Suggested triage:',
              '- Check dependency updates and CI logs.',
              '- Re-run lint and tests locally.',
              '- Review protocol parser regressions or fixture drift.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['weekly-maintenance', 'ci']
            });
